[package]
name = "voice-changer-client"
version = "2.1.4-alpha.2"
description = "Standalone Voice Changer Client"
edition = "2021"
rust-version = "1.94"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["__rustls-tls"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
